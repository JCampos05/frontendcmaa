<header class="header">
  <div class="header-content">
    <div class="header-left">
      <!-- Botón Toggle Sidebar -->
      <button class="sidebar-toggle-btn" (click)="onToggleSidebar()">
        <app-icon name="list"></app-icon>
      </button>

      <div class="logo-section">
        <i class="fa-solid fa-chess-knight logo-icon"></i>
        <h1 class="logo-text">Comité de Ajedrez</h1>
      </div>
    </div>

    <div class="header-right">
      <!-- Perfil de usuario -->
      <div class="profile-container">
        <button class="profile-button" (click)="toggleProfileMenu()" [disabled]="cerrando">
          <div class="profile-avatar">
            <app-icon name="user" weight="regular"></app-icon>
          </div>
          <div class="profile-info">
            <span class="profile-name">Administrador</span>
            <span class="profile-role">{{ currentUser?.telefono || 'Usuario' }}</span>
          </div>
          <app-icon name="caret-down" class="profile-arrow" [class.rotated]="showProfileMenu"></app-icon>
        </button>

        <!-- Menú desplegable -->
        <div class="profile-menu" *ngIf="showProfileMenu">
          <div class="menu-header">
            <div class="menu-avatar">
              <app-icon name="user" weight="regular"></app-icon>
            </div>
            <div class="menu-user-info">
              <span class="menu-name">Administrador</span>
              <span class="menu-phone">{{ currentUser?.telefono }}</span>
            </div>
          </div>

          <div class="menu-divider"></div>

          <button class="menu-item" (click)="goToConfig()" [disabled]="cerrando">
            <app-icon name="gear"></app-icon>
            <span>Configuración</span>
          </button>

          <div class="menu-divider"></div>

          <button class="menu-item danger" (click)="logout()" [disabled]="cerrando">
            <app-icon [name]="cerrando ? 'spinner' : 'sign-out'" [spin]="cerrando"></app-icon>
            <span>{{ cerrando ? 'Cerrando sesión...' : 'Cerrar Sesión' }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
