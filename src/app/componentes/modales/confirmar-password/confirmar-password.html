<div class="modal-overlay" *ngIf="mostrar" (click)="onCancelar()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <i class="ph-bold ph-lock-key"></i>
            <h3>{{ titulo }}</h3>
        </div>
        <div class="modal-body">
            <p>{{ mensaje }}</p>
            <input
                type="password"
                class="password-input"
                placeholder="Contraseña"
                [(ngModel)]="password"
                (keyup.enter)="onConfirmar()"
                autocomplete="current-password" />
            <p *ngIf="error" class="error-text">{{ error }}</p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-modal-cancel" (click)="onCancelar()" [disabled]="cargando">
                <i class="ph-bold ph-x"></i>
                Cancelar
            </button>
            <button type="button" class="btn-modal-primary" (click)="onConfirmar()" [disabled]="cargando || !password">
                <i class="ph-bold ph-check"></i>
                {{ cargando ? 'Verificando...' : textoConfirmar }}
            </button>
        </div>
    </div>
</div>
