<div class="modal-overlay" *ngIf="mostrar" (click)="onCancelar()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <i class="ph-bold" [ngClass]="icono"></i>
            <h3>{{ titulo }}</h3>
        </div>
        <div class="modal-body">
            <p [innerHTML]="mensaje"></p>
            <p *ngIf="mensajeSecundario" [ngClass]="{'warning-text': tipoAdvertencia}" [innerHTML]="mensajeSecundario">
            </p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-modal-cancel" (click)="onCancelar()">
                <i class="ph-bold ph-x"></i>
                {{ textoCancelar }}
            </button>
            <button type="button" class="btn-modal-primary" [ngClass]="{
              'btn-modal-danger': tipoBotonPrimario === 'danger',
              'btn-modal-secondary': tipoBotonPrimario === 'secondary'
            }" (click)="onConfirmar()">
                <i class="ph-bold" [ngClass]="iconoBotonPrimario"></i>
                {{ textoConfirmar }}
            </button>
        </div>
    </div>
</div>
