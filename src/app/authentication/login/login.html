<div class="login-container">

    <div class="login-background">
        <i class="fa-solid fa-chess-king bg-piece piece-1"></i>
        <i class="fa-solid fa-chess-queen bg-piece piece-2"></i>
        <i class="fa-solid fa-chess-rook bg-piece piece-3"></i>
        <i class="fa-solid fa-chess-bishop bg-piece piece-4"></i>
    </div>

    <div class="login-card">
        <button class="btn-back" (click)="goToLanding()">
            <i class="fa-solid fa-arrow-left"></i>
            Volver
        </button>

        <div class="login-header">
            <i class="fa-solid fa-chess-knight login-icon"></i>
            <h2 class="login-title">Iniciar Sesión</h2>
            <p class="login-subtitle">Accede a tu cuenta administrativa del comité de ajedrez </p>
        </div>

        <form class="login-form" (ngSubmit)="onSubmit()">

            <div class="form-group">
                <label for="telefono" class="form-label">
                    <i class="fa-solid fa-phone"></i>
                    Teléfono
                </label>
                <input type="tel" id="telefono" name="telefono" [(ngModel)]="telefono" class="form-input"
                    placeholder="Ingresa tu número de teléfono" [disabled]="loading" required />
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fa-solid fa-lock"></i>
                    Contraseña
                </label>
                <div class="password-wrapper">
                    <input [type]="showPassword ? 'text' : 'password'" id="password" name="password"
                        [(ngModel)]="password" class="form-input" placeholder="Ingresa tu contraseña"
                        [disabled]="loading" required />
                    <button type="button" class="btn-toggle-password" (click)="togglePasswordVisibility()"
                        [disabled]="loading">
                        <i class="fa-solid" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
                    </button>
                </div>
            </div>

            <div class="error-message" *ngIf="errorMessage">
                <i class="fa-solid fa-circle-exclamation"></i>
                {{ errorMessage }}
            </div>

            <button type="submit" class="btn-submit" [disabled]="loading">
                <span *ngIf="!loading">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Iniciar Sesión
                </span>
                <span *ngIf="loading">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    Iniciando...
                </span>
            </button>

        </form>

        <div class="login-footer">
            <p class="footer-text">
                <i class="fa-solid fa-info-circle"></i>
                ¿Olvidaste tu contraseña? Contacta al administrador
            </p>
        </div>
    </div>

</div>
